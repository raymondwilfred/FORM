<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title>

<style>
body{
    font-family: 'Segoe UI';
    background:yellow;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    background:hotpink;
    padding:25px;
    border-radius:15px;
    width:900px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    font-weight:600;
    display:block;
    margin-bottom:5px;
}

input, select, textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

textarea{
    resize:none;
}

.row{
    display:flex;
    gap:10px;
}

.row .form-group{
    flex:1;
}

.options{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.error{
    color:red;
    font-size:12px;
    display:none;
}

input.invalid, select.invalid, textarea.invalid{
    border-color:red;
}

button{
    width:100%;
    padding:12px;
    background:blue;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<h2>Application Form</h2>

<form id="form">


<div class="row">
<div class="form-group">
<label>First Name</label>
<input type="text" id="fname">
<div class="error" id="fnameErr">Required</div>
</div>

<div class="form-group">
<label>Last Name</label>
<input type="text" id="lname">
<div class="error" id="lnameErr">Required</div>
</div>
</div>

<div class="row">
<div class="form-group">
<label>Email</label>
<input type="email" id="email">
<div class="error" id="emailErr">Invalid</div>
</div>

<div class="form-group">
<label>Phone</label>
<input type="tel" id="phone">
<div class="error" id="phoneErr">10 digits</div>
</div>
</div>


<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob">
<div class="error" id="dobErr">Required</div>
</div>
<div class="form-group">
<label>Gender</label>
<div class="options">
<label><input type="radio" name="gender" value="Male"> Male</label>
<label><input type="radio" name="gender" value="Female"> Female</label>
<label><input type="radio" name="gender" value="Other"> Other</label>
</div>
<div class="error" id="genderErr">Select gender</div>
</div>

<div class="form-group">
<label>Skills</label>
<div class="options">
<label><input type="checkbox" value="HTML"> HTML</label>
<label><input type="checkbox" value="CSS"> CSS</label>
<label><input type="checkbox" value="JavaScript"> JS</label>
<label><input type="checkbox" value="Python"> Python</label>
</div>
<div class="error" id="skillErr">Select at least one</div>
</div>

<div class="form-group">
<label>Address</label>
<textarea id="address" rows="3"></textarea>
<div class="error" id="addressErr">Required</div>
</div>

<div class="form-group">
<label>Country</label>
<select id="country">
<option value="">Select</option>
<option>India</option>
<option>USA</option>
<option>UK</option>
</select>
<div class="error" id="countryErr">Select country</div>
</div>


<div class="form-group">
<label>Upload Resume</label>
<input type="file" id="file">
<div class="error" id="fileErr">Upload file</div>
</div>

<div class="row">
<div class="form-group">
<label>Password</label>
<input type="password" id="pass">
<div class="error" id="passErr">Min 8 chars</div>
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirm">
<div class="error" id="confirmErr">Not matching</div>
</div>
</div>


<button type="submit">Submit Application</button>

</form>
</div>

<script>
const form = document.getElementById('form');

form.addEventListener('submit', function(e){
e.preventDefault();
let valid = true;


if(fname.value.trim()==""){ fname.classList.add('invalid'); fnameErr.style.display='block'; valid=false; }
if(lname.value.trim()==""){ lname.classList.add('invalid'); lnameErr.style.display='block'; valid=false; }


if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)){
email.classList.add('invalid'); emailErr.style.display='block'; valid=false;
}

if(!/^\d{10}$/.test(phone.value)){
phone.classList.add('invalid'); phoneErr.style.display='block'; valid=false;
}

if(dob.value==""){
dob.classList.add('invalid'); dobErr.style.display='block'; valid=false;
}

if(!document.querySelector('input[name="gender"]:checked')){
genderErr.style.display='block'; valid=false;
}


if(document.querySelectorAll('input[type="checkbox"]:checked').length < 2){
skillErr.style.display='block'; valid=false;
}

if(address.value.trim()==""){
address.classList.add('invalid'); addressErr.style.display='block'; valid=false;
}

if(country.value==""){
country.classList.add('invalid'); countryErr.style.display='block'; valid=false;
}


if(file.files.length == 0){
fileErr.style.display='block'; valid=false;
}


if(pass.value.length < 8){
pass.classList.add('invalid'); passErr.style.display='block'; valid=false;
}

if(pass.value !== confirm.value){
confirm.classList.add('invalid'); confirmErr.style.display='block'; valid=false;
}



if(valid){
alert("✅ Application Submitted Successfully!");
} else {
alert("❌ Please fill all fields correctly!");
}
});
</script>

</body>
</html>
